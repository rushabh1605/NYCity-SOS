<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City SOS — Dispatch Center Monitor</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="alert-wrapper">

  <!-- Top Status Banner -->
  <header class="alert-header-banner standby" id="alertBanner">
    <div style="display: flex; align-items: center; justify-content: center; gap: 1rem;">
      <span id="bannerText">MONITORING — NO ACTIVE ALERTS</span>
      <span class="active-count-badge" id="activeCountBadge" style="display: none;">0 ALERTS</span>
    </div>
    <button class="clear-all-btn" id="clearAllBtn" style="display: none;">Clear All Alerts</button>
  </header>

  <!-- Standby View (When 0 Active Alerts) -->
  <div class="standby-container" id="standbyView">
    <div class="standby-radar">
      <div class="radar-sweep"></div>
      <div class="radar-dot"></div>
    </div>
    <div class="standby-title">DISPATCH SYSTEM ONLINE</div>
    <div class="standby-subtitle">Listening for stealth emergency alerts via BroadcastChannel & SSE</div>
    <button class="demo-trigger-btn" id="demoTriggerBtn">Simulate Emergency Beacon Alert</button>
  </div>

  <!-- Multi-Alert Cards Container -->
  <main class="alerts-dashboard" id="alertsContainer" style="display: none;">
    <!-- Alert cards dynamically injected here -->
  </main>

  <!-- Judge-Proofing Footer Line -->
  <footer class="alert-footer-note">
    Pending human verification · Dispatch requires operator confirmation
  </footer>

  <script src="/static/alert.js"></script>
</body>
</html>
